services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-secure_qr_db}
      MYSQL_USER: ${MYSQL_USER:-secure_qr_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - ../backend:/app/backend
    command: sh -c "pip install -r requirements.txt && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file:
      - ../.env
    depends_on:
      - mysql
      - redis
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../dist/app/browser:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  mysql_data:
